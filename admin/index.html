<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strapeezzy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#0D0D0D;--white:#FAFAF8;--cream:#F5F0E8;--yellow:#F5C600;--pink:#E87CA0;--teal:#4DCFC4;--green:#22A045;--red:#CC1C3A;--blue:#1A3A8C;--sidebar:240px;--nav-h:60px;--bg:#F0EDE8;--card:#FAFAF8;--border:#E0D8CF;--text:#0D0D0D;--muted:#888;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
input,select,textarea,button{font-family:inherit;}a{text-decoration:none;color:inherit;}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--black);}
.login-box{background:var(--white);border:2px solid var(--black);width:100%;max-width:400px;}
.login-header{background:var(--yellow);padding:28px 32px;border-bottom:2px solid var(--black);}
.login-header h1{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;}
.login-header h1 em{color:var(--pink);font-style:normal;}
.login-header p{font-size:12px;color:rgba(0,0,0,.6);margin-top:4px;letter-spacing:1px;text-transform:uppercase;}
.login-body{padding:32px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;color:#555;}
.field input{width:100%;border:2px solid var(--black);background:var(--cream);padding:12px 14px;font-size:15px;outline:none;}
.field input:focus{border-color:var(--yellow);}
.login-btn{width:100%;background:var(--black);color:var(--yellow);padding:14px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;border:none;cursor:pointer;}
.login-btn:hover{background:#222;}
.login-err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;}
#appShell{display:none;height:100vh;flex-direction:column;}
#appShell.show{display:flex;}
.topbar{height:var(--nav-h);background:var(--black);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:2px solid #222;flex-shrink:0;}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--white);}
.topbar-logo em{color:var(--pink);font-style:normal;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.topbar-user{font-size:12px;color:#888;letter-spacing:1px;}
.topbar-btn{background:var(--yellow);color:var(--black);border:none;padding:7px 16px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;cursor:pointer;}
.topbar-btn.outline{background:transparent;color:#888;border:1px solid #333;}
.topbar-btn.outline:hover{color:var(--white);}
.shell-body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:var(--sidebar);background:var(--black);display:flex;flex-direction:column;border-right:1px solid #222;flex-shrink:0;overflow-y:auto;}
.nav-section{padding:20px 0 8px;}
.nav-section-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#444;padding:0 20px;margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:13px;font-weight:500;color:#888;cursor:pointer;transition:background .15s,color .15s;border-left:3px solid transparent;}
.nav-item:hover{background:#111;color:var(--white);}
.nav-item.active{background:#111;color:var(--yellow);border-left-color:var(--yellow);}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--red);color:var(--white);font-size:10px;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center;}
.main{flex:1;overflow-y:auto;padding:28px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;}
.page-subtitle{font-size:13px;color:var(--muted);margin-top:2px;}
.card{background:var(--card);border:2px solid var(--black);margin-bottom:20px;}
.card-header{padding:16px 20px;border-bottom:2px solid var(--black);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;}
.card-body{padding:20px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px;margin-bottom:20px;}
.stat-box{background:var(--card);border:2px solid var(--black);padding:20px;position:relative;overflow:hidden;}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
.stat-icon{position:absolute;top:12px;right:16px;font-size:28px;opacity:.15;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 14px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--black);background:var(--cream);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:hover td{background:var(--cream);}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
.badge-green{background:#DCFCE7;color:var(--green);border:1px solid #86EFAC;}
.badge-yellow{background:#FEF9C3;color:#854D0E;border:1px solid #FDE047;}
.badge-red{background:#FEE2E2;color:var(--red);border:1px solid #FCA5A5;}
.badge-blue{background:#DBEAFE;color:#1E40AF;border:1px solid #93C5FD;}
.badge-gray{background:#F3F4F6;color:#374151;border:1px solid #D1D5DB;}
.btn{padding:8px 18px;border:2px solid var(--black);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--black);color:var(--yellow);}
.btn-primary:hover{background:var(--yellow);color:var(--black);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-danger{background:var(--red);color:var(--white);border-color:var(--red);}
.btn-ghost{background:transparent;color:var(--black);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--black);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-field{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;color:#555;}
.form-input,.form-select,.form-textarea{width:100%;border:2px solid var(--border);background:var(--cream);padding:10px 12px;font-size:14px;outline:none;transition:border-color .2s;border-radius:0;-webkit-appearance:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--yellow);}
.form-textarea{resize:vertical;min-height:100px;}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;border:2px solid var(--black);background:var(--cream);padding:9px 14px;font-size:14px;outline:none;}
.search-input:focus{border-color:var(--yellow);}
.toggle{display:flex;align-items:center;gap:10px;}
.toggle-switch{width:44px;height:24px;background:#ccc;border-radius:99px;position:relative;cursor:pointer;transition:background .2s;border:2px solid var(--black);}
.toggle-switch.on{background:var(--yellow);}
.toggle-knob{width:16px;height:16px;background:var(--black);border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s;}
.toggle-switch.on .toggle-knob{left:22px;}
.counter-display{background:var(--black);color:var(--yellow);padding:24px 32px;display:inline-flex;flex-direction:column;align-items:center;}
.counter-num{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;}
.counter-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#888;margin-top:4px;}
.counter-controls{display:flex;gap:8px;margin-top:12px;}
.counter-btn{width:36px;height:36px;background:var(--yellow);color:var(--black);border:2px solid var(--black);font-size:20px;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;}
.counter-btn:hover{background:var(--white);}
.modal-bg{display:none;position:fixed;inset:0;z-index:1000;background:rgba(13,13,13,.8);align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--white);border:2px solid var(--black);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-h{padding:20px 24px;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;align-items:center;}
.modal-h h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:2px solid var(--black);display:flex;justify-content:flex-end;gap:10px;}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast-item{background:var(--black);color:var(--white);padding:14px 18px;border-left:4px solid var(--yellow);font-size:13px;animation:slideUp .3s ease;}
.toast-item.error{border-left-color:var(--red);}
.toast-item.success{border-left-color:var(--green);}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.tabs{display:flex;border-bottom:2px solid var(--black);margin-bottom:20px;}
.tab{padding:10px 20px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);transition:color .2s;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--black);border-bottom-color:var(--yellow);}
.empty{padding:48px;text-align:center;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
@media(max-width:768px){.sidebar{display:none;}.form-grid{grid-template-columns:1fr;}.stat-grid{grid-template-columns:repeat(2,1fr);}.main{padding:16px;}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="login-header"><h1>STRAPEE<em>ZZY</em></h1><p>Admin Dashboard</p></div>
    <div class="login-body">
      <div class="field"><label>Username</label><input type="text" id="loginUser" placeholder="admin" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="login-btn" onclick="doLogin()">Sign In →</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>
<div id="appShell">
  <div class="topbar">
    <div class="topbar-logo">STRAPEE<em>ZZY</em> <span style="font-size:11px;color:#444;letter-spacing:2px;font-family:sans-serif">ADMIN</span></div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbarUser"></span>
      <button class="topbar-btn" onclick="window.open('/','_blank')">View Site</button>
      <button class="topbar-btn outline" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="shell-body">
    <aside class="sidebar">
      <div class="nav-section"><div class="nav-section-label">Overview</div>
        <div class="nav-item active" onclick="showPage('dashboard')"><span class="nav-icon">📊</span>Dashboard</div>
        <div class="nav-item" onclick="showPage('activity')"><span class="nav-icon">📋</span>Activity Log</div>
      </div>
      <div class="nav-section"><div class="nav-section-label">Commerce</div>
        <div class="nav-item" onclick="showPage('products')"><span class="nav-icon">👕</span>Products</div>
        <div class="nav-item" onclick="showPage('orders')"><span class="nav-icon">📦</span>Orders<span class="nav-badge" id="unfulfilledBadge" style="display:none">0</span></div>
        <div class="nav-item" onclick="showPage('fulfillment')"><span class="nav-icon">🚚</span>Fulfillment</div>
      </div>
      <div class="nav-section"><div class="nav-section-label">Growth</div>
        <div class="nav-item" onclick="showPage('waitlist')"><span class="nav-icon">⏳</span>Waitlist</div>
        <div class="nav-item" onclick="showPage('campaigns')"><span class="nav-icon">📧</span>Email Campaigns</div>
      </div>
      <div class="nav-section"><div class="nav-section-label">Site</div>
        <div class="nav-item" onclick="showPage('design')"><span class="nav-icon">🎨</span>Design & Copy</div>
        <div class="nav-item" onclick="showPage('settings')"><span class="nav-icon">⚙️</span>Settings</div>
        <div class="nav-item" onclick="showPage('users')"><span class="nav-icon">👤</span>Admin Users</div>
      </div>
    </aside>
    <main class="main" id="mainContent"></main>
  </div>
</div>
<div class="modal-bg" id="orderModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal"><div class="modal-h"><h3 id="orderModalTitle">Order Details</h3><button class="modal-close" onclick="document.getElementById('orderModal').classList.remove('open')">✕</button></div><div class="modal-body" id="orderModalBody"></div></div>
</div>
<div class="modal-bg" id="fulfillModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal"><div class="modal-h"><h3>Update Fulfillment</h3><button class="modal-close" onclick="document.getElementById('fulfillModal').classList.remove('open')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="fulfillOrderId">
      <div class="form-field"><label class="form-label">Status</label><select class="form-select" id="fulfillStatus"><option value="unfulfilled">Unfulfilled</option><option value="in_progress">In Progress</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option></select></div>
      <div class="form-field"><label class="form-label">Tracking Number</label><input class="form-input" id="fulfillTracking" placeholder="1Z999AA10123456784"></div>
      <div class="form-field"><label class="form-label">Carrier</label><select class="form-select" id="fulfillCarrier"><option value="">Select carrier</option><option>Royal Mail</option><option>DHL</option><option>FedEx</option><option>UPS</option><option>USPS</option><option>DPD</option><option>Evri</option></select></div>
      <div class="form-field"><label class="form-label">Tracking URL</label><input class="form-input" id="fulfillUrl" placeholder="https://track.dhl.com/..."></div>
      <div class="form-field"><label class="form-label">Internal Notes</label><textarea class="form-textarea" id="fulfillNotes" rows="3"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('fulfillModal').classList.remove('open')">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveFulfillment()">Save & Notify Customer</button></div>
  </div>
</div>
<div id="toast"></div>
<script>
const API='';let TOKEN=localStorage.getItem('sz_admin_token');let ADMIN_USER={};let STATE={config:{},stats:{},currentPage:'dashboard'};
async function doLogin(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value;const r=await apiFetch('/api/admin/login',{method:'POST',body:JSON.stringify({username:u,password:p})},false);if(r.error){document.getElementById('loginErr').textContent=r.error;return;}TOKEN=r.token;localStorage.setItem('sz_admin_token',TOKEN);ADMIN_USER=r;document.getElementById('topbarUser').textContent=r.username+' · '+r.role;document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').classList.add('show');loadApp();}
function logout(){localStorage.removeItem('sz_admin_token');location.reload();}
async function apiFetch(path,opts={},auth=true){const h={'Content-Type':'application/json',...(auth&&TOKEN?{'Authorization':'Bearer '+TOKEN}:{})};try{const r=await fetch(API+path,{...opts,headers:{...h,...(opts.headers||{})}});return await r.json();}catch(e){return{error:e.message};}}
function toast(msg,type='success'){const el=document.createElement('div');el.className='toast-item '+type;el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),4000);}
async function loadApp(){const[config,stats,counts]=await Promise.all([apiFetch('/api/admin/config'),apiFetch('/api/orders/stats'),apiFetch('/api/waitlist/counts')]);STATE.config={...config,...counts};STATE.stats=stats;if((stats.unfulfilled||0)>0){const b=document.getElementById('unfulfilledBadge');b.textContent=stats.unfulfilled;b.style.display='';}showPage('dashboard');}
function showPage(page){STATE.currentPage=page;document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));const ni=document.querySelector('[onclick="showPage(\''+page+'\')"]');if(ni)ni.classList.add('active');const pages={dashboard:renderDashboard,products:renderProducts,orders:renderOrders,fulfillment:renderFulfillment,waitlist:renderWaitlist,campaigns:renderCampaigns,design:renderDesign,settings:renderSettings,activity:renderActivity,users:renderUsers};(pages[page]||renderDashboard)();}
function renderDashboard(){const s=STATE.stats;const c=STATE.config;const rev=s.total_revenue?'$'+(s.total_revenue/100).toFixed(2):'$0.00';document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-subtitle">Strapeezzy Overview</div></div></div><div class="stat-grid"><div class="stat-box"><div class="stat-icon">💰</div><div class="stat-value">${rev}</div><div class="stat-label">Total Revenue</div></div><div class="stat-box"><div class="stat-icon">📦</div><div class="stat-value">${s.total_orders||0}</div><div class="stat-label">Total Orders</div></div><div class="stat-box" style="border-left:4px solid var(--red)"><div class="stat-icon">🔴</div><div class="stat-value">${s.unfulfilled||0}</div><div class="stat-label">Needs Fulfillment</div></div><div class="stat-box"><div class="stat-icon">🚚</div><div class="stat-value">${s.shipped||0}</div><div class="stat-label">Shipped</div></div><div class="stat-box" style="border-left:4px solid var(--yellow)"><div class="stat-icon">⏳</div><div class="stat-value">${c.waitlist_count||0}</div><div class="stat-label">Waitlist</div></div><div class="stat-box" style="border-left:4px solid var(--teal)"><div class="stat-icon">📧</div><div class="stat-value">${c.maillist_count||0}</div><div class="stat-label">Mailing List</div></div><div class="stat-box"><div class="stat-icon">📅</div><div class="stat-value">${s.today||0}</div><div class="stat-label">Orders Today</div></div><div class="stat-box"><div class="stat-icon">📈</div><div class="stat-value">${s.this_week||0}</div><div class="stat-label">This Week</div></div></div><div class="card"><div class="card-header"><div class="card-title">Top Products</div></div><div class="card-body">${(s.by_product||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${p.product_name}</span><strong>${p.count} orders</strong></div>`).join('')||'<div class="empty"><div class="empty-icon">📭</div><p>No orders yet</p></div>'}</div></div><div class="card"><div class="card-header"><div class="card-title">Quick Actions</div></div><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="showPage(\'orders\')">📦 Orders</button><button class="btn btn-primary" onclick="showPage(\'fulfillment\')">🚚 Fulfillment</button><button class="btn btn-primary" onclick="showPage(\'waitlist\')">⏳ Waitlist</button><button class="btn btn-primary" onclick="showPage(\'campaigns\')">📧 Campaigns</button><button class="btn btn-primary" onclick="showPage(\'design\')">🎨 Edit Site</button></div></div>`;}
async function renderOrders(){document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Orders</div></div><button class="btn btn-primary btn-sm" onclick="openManualOrder()">+ Manual Order</button></div><div class="search-bar"><input class="search-input" id="orderSearch" placeholder="Search..." onkeydown="if(event.key==='Enter')loadOrders()"><select class="form-select" style="width:auto" id="orderStatusFilter" onchange="loadOrders()"><option value="">All Status</option><option value="paid">Paid</option><option value="pending">Pending</option><option value="refunded">Refunded</option></select><select class="form-select" style="width:auto" id="orderFulfillFilter" onchange="loadOrders()"><option value="">All Fulfillment</option><option value="unfulfilled">Unfulfilled</option><option value="in_progress">In Progress</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option></select><button class="btn btn-primary btn-sm" onclick="loadOrders()">Search</button></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Order#</th><th>Customer</th><th>Product</th><th>Total</th><th>Status</th><th>Fulfillment</th><th>Date</th><th>Actions</th></tr></thead><tbody id="ordersBody"><tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted)">Loading...</td></tr></tbody></table></div></div>`;loadOrders();}

async function renderWaitlist(){const counts=await apiFetch('/api/waitlist/counts');STATE.config.waitlist_count=counts.waitlist_count;STATE.config.maillist_count=counts.maillist_count;const data=await apiFetch('/api/waitlist?limit=200');const entries=data.entries||[];document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Waitlist</div><div class="page-subtitle">${data.total||0} total entries</div></div><button class="btn btn-primary btn-sm" onclick="notifyWaitlist()">🚨 Send Launch Email + SMS</button></div><div style="display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap"><div><div class="counter-display"><div class="counter-num" id="wcNum">${counts.waitlist_count||0}</div><div class="counter-label">Waitlist</div><div class="counter-controls"><button class="counter-btn" onclick="adjustCount('waitlist_count',-1)">−</button><button class="counter-btn" onclick="adjustCount('waitlist_count',1)">+</button></div></div></div><div><div class="counter-display" style="background:#1A3A8C"><div class="counter-num" id="mlNum">${counts.maillist_count||0}</div><div class="counter-label">Mailing List</div><div class="counter-controls"><button class="counter-btn" onclick="adjustCount('maillist_count',-1)">−</button><button class="counter-btn" onclick="adjustCount('maillist_count',1)">+</button></div></div></div><div style="flex:1;min-width:220px"><div class="card" style="margin:0"><div class="card-header"><div class="card-title">Set Exact Count</div></div><div class="card-body"><div class="form-field"><label class="form-label">Waitlist</label><div style="display:flex;gap:8px"><input class="form-input" id="wcInput" type="number" value="${counts.waitlist_count||0}"><button class="btn btn-primary btn-sm" onclick="setExactCount('waitlist_count','wcInput')">Set</button></div></div><div class="form-field"><label class="form-label">Mail List</label><div style="display:flex;gap:8px"><input class="form-input" id="mlInput" type="number" value async function renderActivity(){const logs=await apiFetch('/api/admin/activity');document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Activity Log</div></div></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Entity</th></tr></thead><tbody>${(Array.isArray(logs)?logs:[]).map(l=>`<tr><td style="font-size:11px;white-space:nowrap">${new Date(l.created_at).toLocaleString()}</td><td><strong>${l.admin_username||'—'}</strong></td><td><code style="font-size:11px;background:var(--cream);padding:2px 6px">${l.action}</code></td><td style="font-size:12px;color:var(--muted)">${l.entity||''} ${l.entity_id||''}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty"><div class="empty-icon">📋</div><p>No activity yet</p></div></td></tr>'}</tbody></table></div></div>`;}
async function renderUsers(){const users=await apiFetch('/api/admin/users');document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Admin Users</div></div><button class="btn btn-primary btn-sm" onclick="openCreateUser()">+ Add User</button></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Last Login</th><th>Created</th></tr></thead><tbody>${(Array.isArray(users)?users:[]).map(u=>`<tr><td><strong>${u.username}</strong></td><td>${u.email||'—'}</td><td><span class="badge ${u.role==='superadmin'?'badge-yellow':'badge-blue'}">${u.role}</span></td><td style="font-size:11px">${u.last_login?new Date(u.last_login).toLocaleString():'Never'}</td><td style="font-size:11px">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div></div>`;}
function openCreateUser(){document.getElementById('orderModalTitle').textContent='Create Admin User';document.getElementById('orderModalBody').innerHTML=`<div class="form-field"><label class="form-label">Username</label><input class="form-input" id="nu_user" placeholder="manager"></div><div class="form-field"><label class="form-label">Password</label><input class="form-input" id="nu_pass" type="password"></div><div class="form-field"><label class="form-label">Email</label><input class="form-input" id="nu_email" type="email"></div><div class="form-field"><label class="form-label">Role</label><select class="form-select" id="nu_role"><option value="admin">Admin</option><option value="superadmin">Superadmin</option></select></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('orderModal').classList.remove('open')">Cancel</button><button class="btn btn-primary btn-sm" onclick="createUser()">Create User</button></div>`;document.getElementById('orderModal').classList.add('open');}
async function createUser(){const body={username:document.getElementById('nu_user').value,password:document.getElementById('nu_pass').value,email:document.getElementById('nu_email').value,role:document.getElementById('nu_role').value};const res=await apiFetch('/api/admin/users',{method:'POST',body:JSON.stringify(body)});if(res.success){toast('Admin user created');document.getElementById('orderModal').classList.remove('open');renderUsers();}else toast(res.error||'Error','error');}
function openManualOrder(){document.getElementById('orderModalTitle').textContent='Create Manual Order';document.getElementById('orderModalBody').innerHTML=`<div class="form-grid"><div class="form-field"><label class="form-label">Name</label><input class="form-input" id="mo_name"></div><div class="form-field"><label class="form-label">Email</label><input class="form-input" id="mo_email" type="email"></div><div class="form-field"><label class="form-label">Phone</label><input class="form-input" id="mo_phone"></div><div class="form-field"><label class="form-label">Product</label><select class="form-select" id="mo_product"><option>OTG ROZ</option><option>Otto Rosso</option><option>Green Eight</option><option>Huit Blanc</option><option>Blaue Acht</option><option>Ocho Negro</option><option>Lan Ba</option><option>Orenji Hachi</option></select></div><div class="form-field"><label class="form-label">Price (cents)</label><input class="form-input" id="mo_price" value="7900"></div><div class="form-field"><label class="form-label">Qty</label><input class="form-input" id="mo_qty" type="number" value="1" min="1"></div></div><div class="form-field"><label class="form-label">Shipping Address</label><textarea class="form-textarea" id="mo_address" rows="3"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('orderModal').classList.remove('open')">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveManualOrder()">Create & Email Customer</button></div>`;document.getElementById('orderModal').classList.add('open');}
async function saveManualOrder(){const body={customer_name:document.getElementById('mo_name').value,customer_email:document.getElementById('mo_email').value,customer_phone:document.getElementById('mo_phone').value,product_name:document.getElementById('mo_product').value,quantity:document.getElementById('mo_qty').value,unit_price:document.getElementById('mo_price').value,shipping_address:document.getElementById('mo_address').value};const res=await apiFetch('/api/orders/manual',{method:'POST',body:JSON.stringify(body)});if(res.success){toast('Manual order created');document.getElementById('orderModal').classList.remove('open');loadOrders();}else toast(res.error||'Error','error');}
async function renderProducts(){const products=await apiFetch('/api/products/admin/all');document.getElementById('mainContent').innerHTML=`<div class="page-header"><div><div class="page-title">Products</div><div class="page-subtitle">${products.length||0} total</div></div><button class="btn btn-primary btn-sm" onclick="openAddProduct()">+ Add Product</button></div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Colorway</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${(products||[]).map(p=>`<tr><td><code style="font-size:11px">${p.sku}</code></td><td><strong>${p.name}</strong></td><td>$${(p.price_cents/100).toFixed(2)}</td><td>${p.colorway||'—'}</td><td>${p.stock_quantity}</td><td><span class="badge ${p.is_active?'badge-green':'badge-gray'}">${p.is_active?'Active':'Inactive'}</span></td><td><button class="btn btn-sm" style="background:var(--yellow);color:var(--black)" onclick="editProduct(${p.id})">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id},this)">Delete</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><div class="empty-icon">📭</div><p>No products. Create one to get started!</p></div></td></tr>'}</tbody></table></div></div>`;}
function openAddProduct(){document.getElementById('orderModalTitle').textContent='Add Product';document.getElementById('orderModalBody').innerHTML=`<div class="form-grid"><div class="form-field"><label class="form-label">SKU</label><input class="form-input" id="ap_sku" placeholder="e.g., OTG-001"></div><div class="form-field"><label class="form-label">Name</label><input class="form-input" id="ap_name" placeholder="e.g., OTG ROZ"></div><div class="form-field"><label class="form-label">Colorway</label><input class="form-input" id="ap_colorway" placeholder="Pink / Yellow"></div><div class="form-field"><label class="form-label">Price ($)</label><input class="form-input" id="ap_price" type="number" placeholder="79.00" step="0.01"></div><div class="form-field"><label class="form-label">Stock</label><input class="form-input" id="ap_stock" type="number" value="100" min="0"></div><div class="form-field"><label class="form-label">Image URL</label><input class="form-input" id="ap_image" placeholder="/images/img-0.jpg"></div></div><div class="form-field"><label class="form-label">Description</label><textarea class="form-textarea" id="ap_desc" rows="2"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="document.getElementById('orderModal').classList.remove('open')">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveProduct()">Create Product</button></div>`;document.getElementById('orderModal').classList.add('open');}
async function saveProduct(){const sku=document.getElementById('ap_sku').value.trim();const name=document.getElementById('ap_name').value.trim();const colorway=document.getElementById('ap_colorway').value.trim();const price=parseFloat(document.getElementById('ap_price').value)*100;const stock=parseInt(document.getElementById('ap_stock').value);const image=document.getElementById('ap_image').value.trim();const desc=document.getElementById('ap_desc').value.trim();if(!sku||!name||!price){toast('SKU, Name, and Price required','error');return;}const fd=new FormData();fd.append('sku',sku);fd.append('name',name);fd.append('colorway',colorway);fd.append('price_cents',price);fd.append('stock_quantity',stock);fd.append('image_url',image);fd.append('description',desc);const res=await fetch('/api/products/admin',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});const data=await res.json();if(res.ok){toast('Product created ✅');document.getElementById('orderModal').classList.remove('open');renderProducts();}else{toast(data.detail||'Error','error');}}
async function editProduct(id){
  const p=await apiFetch('/api/products/'+id);
  if(p.error){toast('Failed to load product','error');return;}
  document.getElementById('orderModalTitle').textContent='Edit Product';
  document.getElementById('orderModalBody').innerHTML=`
    <input type="hidden" id="ep_id" value="${p.id}">
    <div class="form-grid">
      <div class="form-field"><label class="form-label">SKU</label><input class="form-input" id="ep_sku" value="${p.sku}" disabled style="opacity:.5;cursor:not-allowed"></div>
      <div class="form-field"><label class="form-label">Name</label><input class="form-input" id="ep_name" value="${p.name||''}"></div>
      <div class="form-field"><label class="form-label">Colorway</label><input class="form-input" id="ep_colorway" value="${p.colorway||''}"></div>
      <div class="form-field"><label class="form-label">Price ($)</label><input class="form-input" id="ep_price" type="number" step="0.01" value="${(p.price_cents/100).toFixed(2)}"></div>
      <div class="form-field"><label class="form-label">Stock</label><input class="form-input" id="ep_stock" type="number" min="0" value="${p.stock_quantity}"></div>
      <div class="form-field"><label class="form-label">Image URL</label><input class="form-input" id="ep_image" value="${p.image_url||''}" placeholder="/images/img-0.jpg"></div>
    </div>
    <div class="form-field"><label class="form-label">Description</label><textarea class="form-textarea" id="ep_desc" rows="4">${p.description||''}</textarea></div>
    <div class="form-field">
      <label class="form-label">Status</label>
      <select class="form-select" id="ep_active">
        <option value="true" ${p.is_active?'selected':''}>Active</option>
        <option value="false" ${!p.is_active?'selected':''}>Inactive</option>
      </select>
    </div>
    ${p.image_url?`<div style="margin-bottom:16px"><img src="${p.image_url}" style="height:120px;object-fit:cover;border:2px solid var(--black)"></div>`:''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('orderModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveEditProduct()">Save Changes</button>
    </div>`;
  document.getElementById('orderModal').classList.add('open');
}
async function saveEditProduct(){
  const id=document.getElementById('ep_id').value;
  const price=Math.round(parseFloat(document.getElementById('ep_price').value)*100);
  const fd=new FormData();
  fd.append('name',document.getElementById('ep_name').value.trim());
  fd.append('colorway',document.getElementById('ep_colorway').value.trim());
  fd.append('price_cents',price);
  fd.append('stock_quantity',document.getElementById('ep_stock').value);
  fd.append('description',document.getElementById('ep_desc').value.trim());
  fd.append('is_active',document.getElementById('ep_active').value==='true');
  const imageVal=document.getElementById('ep_image').value.trim();
  if(imageVal)fd.append('image_url',imageVal);
  const res=await fetch('/api/products/admin/'+id,{method:'PATCH',headers:{'Authorization':'Bearer '+TOKEN},body:fd});
  const data=await res.json();
  if(res.ok){toast('Product updated ✅');document.getElementById('orderModal').classList.remove('open');renderProducts();}
  else toast(data.detail||'Error saving product','error');
}
async function deleteProduct(id,btn){if(!confirm('Delete this product?'))return;const res=await apiFetch('/api/products/admin/'+id,{method:'DELETE'});if(res.success){btn.closest('tr').remove();toast('Product deleted');}else toast('Error','error');}
if(TOKEN){apiFetch('/api/admin/me').then(user=>{if(user&&user.id){ADMIN_USER=user;document.getElementById('topbarUser').textContent=user.username+' · '+user.role;document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').classList.add('show');loadApp();}else{localStorage.removeItem('sz_admin_token');TOKEN=null;}});}
</script>
</body>
</html>
